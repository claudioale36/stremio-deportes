# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — stremio-deportes-updater
#
# Volúmenes montados:
#   /app/repo → el repo clonado en el host (lectura/escritura para git push)
#
# Autenticación git: HTTPS + PAT (Personal Access Token)
#   El token se lee desde ../.env (GITHUB_TOKEN) y se inyecta al contenedor.
#   Evita los problemas de bad owner que tiene SSH con volúmenes Docker.
#
# Arranque:
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  stremio-updater:
    build:
      context: .
      # network: host — BuildKit usa la red del host durante el build,
      # heredando su DNS. Sin esto, apt-get update falla (exit 100) porque
      # el namespace de red de BuildKit no resuelve mirrors externos.
      network: host
    container_name: stremio-updater
    restart: unless-stopped
    # DNS explícito para el build y runtime — evita que el daemon use el resolver
    # interno de Docker que falla en algunas redes/hosts (síntoma: apt-get exit 100)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Repositorio del host — el updater escribe streams.json y hace push.
      # Ruta relativa al docker-compose.yml (updater/) → apunta a la raíz del repo.
      - ../:/app/repo
    env_file:
      # Lee GITHUB_TOKEN desde el .env en la raíz del repo (un nivel arriba del updater/)
      - ../.env
    environment:
      REPO_PATH:              /app/repo
      STREAMS_JSON_PATH:      /app/repo/streams.json
      EXTRACTOR_CONFIG_PATH:  /app/updater/extractor-config.json
      UPDATE_INTERVAL_HOURS:  "3"
      MAX_TOKEN_AGE_HOURS:    "3"
      # Permite forzar extracción inmediata desde la shell del host:
      # sudo FORCE_UPDATE=1 docker compose up -d
      # Si no se define en el host, queda en "0" (comportamiento normal).
      FORCE_UPDATE:           "${FORCE_UPDATE:-0}"
