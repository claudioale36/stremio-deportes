# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml — stremio-deportes-updater
#
# Volúmenes montados:
#   /app/repo  → el repo clonado en el host (lectura/escritura para git push)
#   /root/.ssh → claves SSH del host (solo lectura — para autenticar el push)
#
# Arranque:
#   docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  stremio-updater:
    build:
      context: .
      # network: host — BuildKit usa la red del host durante el build,
      # heredando su DNS. Sin esto, apt-get update falla (exit 100) porque
      # el namespace de red de BuildKit no resuelve mirrors externos.
      network: host
    container_name: stremio-updater
    restart: unless-stopped
    # DNS explícito para el build y runtime — evita que el daemon use el resolver
    # interno de Docker que falla en algunas redes/hosts (síntoma: apt-get exit 100)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      # Repositorio del host — el updater escribe streams.json y hace push
      - /mnt/Archivos2/sincronizados/only-pc/linux-and-windows/Programacion/Proyectos/stremio-addons/stremio-deportes:/app/repo
      # Claves SSH del host — solo lectura, para autenticar el git push
      - ~/.ssh:/root/.ssh:ro
    environment:
      REPO_PATH:              /app/repo
      STREAMS_JSON_PATH:      /app/repo/streams.json
      EXTRACTOR_CONFIG_PATH:  /app/updater/extractor-config.json
      UPDATE_INTERVAL_HOURS:  "3"
      MAX_TOKEN_AGE_HOURS:    "3"
